[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-review"
version = "1.0.0"
description = "Analyse tes parties d'échecs avec Stockfish"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.11",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chess-review = "src.cli:main"

[project.gui-scripts]
chess-review-gui = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.core", "src.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"